interface:
  display_name: "X to Ob"
  short_description: "Convert X likes JSON into an Obsidian-ready Markdown archive with merge/create and zh/en title output"
  default_prompt: "Use $x-to-obsidian to convert X likes JSON into local Markdown with semantic classification and indexes. Before running, tell the user which inputs are required, show the allowed options for each field, and collect them in a short one-question-at-a-time flow by default. For enum-style fields, default to compact selectable options with a brief explanation for each option, and use structured prompt-box choices when the environment supports them; otherwise simulate that same experience in plain text so the user can reply with just the option value. Only offer a single structured reply line as an optional shortcut if the user wants it. If the user is updating or merging into an existing X Likes archive, inspect that archive first and treat its current language, naming, and category structure as the source of truth. If the user selects auto, keep using the built-in JSON-signal classifier. If the user selects manual, first look for X Likes/03 Domain/ROOT分类目录.md and use it automatically when present; otherwise accept either a JSON rules file or a Markdown taxonomy/rule note via another path. In merge flows, preserve the fixed root structure of X Likes and use classification only to rebuild 03 Domain within the chosen taxonomy."
